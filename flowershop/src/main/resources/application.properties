spring.datasource.url=jdbc:mysql://localhost:3307/flower_shop_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Real SMTP; configure credentials in the backend process environment.
spring.config.import=optional:file:./application-mail-local.properties
app.jwt.secret=${JWT_SECRET:}
# Local fallback generates a new signing key each restart (old tokens become invalid).
# Production: set JWT_SECRET to Base64 of 32+ random bytes and this option to false.
app.jwt.allow-ephemeral-key=${JWT_ALLOW_EPHEMERAL_KEY:true}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@flowershop.local}}

# Delivery area allowlist (semicolon-separated city names).
app.delivery.allowed-cities=\u0048\u00e0 \u004e\u1ed9\u0069
